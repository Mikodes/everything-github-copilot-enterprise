version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: egce-postgres
    environment:
      POSTGRES_USER: egce
      POSTGRES_PASSWORD: egce_dev_password
      POSTGRES_DB: memory_bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egce -d memory_bank"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: egce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  memory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: egce-memory-service
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://egce:egce_dev_password@postgres:5432/memory_bank
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro

volumes:
  postgres_data:
  redis_data:
